name: WNBA Dice Poker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wnba-dice-poker-writer
  cancel-in-progress: false

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate active-game Dice Poker
        run: python dice_poker.py

      - name: Commit new results
        run: |
          if [ -f .changed ]; then
            rm .changed
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Add Dice Poker result $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          else
            echo "No new result to commit."
          fi
